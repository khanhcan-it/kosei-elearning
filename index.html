<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f6">
  <meta name="description" content="Thư viện bài học — tìm và mở bài học nhanh chóng.">
  <title>Thư viện bài học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/vimeo.js" defer></script>
  <script src="./js/data.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Thư viện bài học">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z" />
          <path d="M4 5.5v16M8 7h8M8 11h6" />
        </svg>
      </span>
      <span>Study Notes</span>
    </a>
    <div class="topbar-tools">
      <label class="course-picker">
        <span class="sr-only">Chọn khóa học</span>
        <select id="courseSelect" aria-label="Chọn khóa học">
          <option>Đang tải khóa học…</option>
        </select>
      </label>
      <label class="searchbox" id="searchBox">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" />
          <path d="m16 16 4.5 4.5" />
        </svg>
        <span class="sr-only">Tìm bài học</span>
        <input id="searchInput" type="search" placeholder="Tìm bài học…" autocomplete="off" aria-label="Tìm bài học">
      </label>
    </div>
  </header>

  <main id="top" class="main-content">
    <section class="page-heading">
      <div>
        <p class="eyebrow" id="currentCourse">THƯ VIỆN BÀI HỌC</p>
        <h1>Thư viện bài học</h1>
      </div>
      <p id="resultCount" class="result-count" aria-live="polite"></p>
    </section>

    <nav id="categoryNav" class="category-nav" aria-label="Danh mục bài học"></nav>
    <div id="notice" class="notice" role="status" hidden></div>

    <div class="scoller">
      <section id="lessonList" class="lesson-grid" aria-label="Danh sách bài học" aria-live="polite">
        <div class="empty-state"><span class="spinner"></span>
          <p>Đang tải bài học…</p>
        </div>
      </section>
    </div>

    <footer class="main-footer">Học theo cách của bạn.</footer>
  </main>

  <div class="modal-backdrop" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <section class="video-dialog">
      <header class="video-dialog-header">
        <h2 id="modalTitle">Bài học</h2>
        <button id="closeModalButton" class="close-modal" type="button" aria-label="Đóng video">×</button>
      </header>
      <div id="videoFrameHost" class="video-frame-host"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>

</html>
